name: VProfile CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build Application
  build:
    name: 1. Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Application
        run: mvn -B clean package -DskipTests

  # 2. Run Unit Tests
  test:
    name: 2. Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test

  # 3. SonarCloud Analysis
  sonar:
    name: 3. SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Compiled Classes
        run: mvn -B -DskipTests package

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_KEY: ${{ vars.PROJECT_KEY }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}

        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="${ORGANIZATION}" \
            -Dsonar.projectKey="${PROJECT_KEY}" \
            -Dsonar.projectName="${PROJECT_NAME}" \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # 4. Build Docker Image, Push to ECR, Trigger Terraform
  docker-build-push:
    name: 4. Docker Build and ECR Push
    runs-on: ubuntu-latest
    needs: sonar

    # Do not push images or trigger deployment for pull requests.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          echo "image_uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Trigger Terraform Infrastructure Repository
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n \
              --arg image "$IMAGE_URI" \
              '{
                event_type: "deploy-image",
                client_payload: {
                  image_uri: $image
                }
              }')"

      - name: Deployment Triggered
        run: echo "Docker image pushed to ECR and infrastructure workflow triggered."