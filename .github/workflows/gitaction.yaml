
name: Hprofile Actions
env:
  AWS_REGION: us-east-2
on:
  workflow_dispatch:

jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Code checkout
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java Version
      - name: Check Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Maven Build and Test
      - name: Maven Build and Test
        run: mvn clean verify

      # 5. Checkstyle
      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # 6. SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/
            -Dsonar.junit.reportPaths=target/surefire-reports/
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.java.binaries=target/classes

  BUILD_AND_PUBLISH:
    needs: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Update application.properties file
        env:
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASS: ${{ secrets.RDS_PASS }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import os
          import re

          file_path = "src/main/resources/application.properties"

          with open(file_path, "r") as file:
              content = file.read()

          username = os.environ["RDS_USER"]
          password = os.environ["RDS_PASS"]
          endpoint = os.environ["RDS_ENDPOINT"]

          if not all([username, password, endpoint]):
              raise ValueError("RDS secrets are missing!")

          content, user_count = re.subn(
              r"(?m)^jdbc.username=.*$",
              lambda m: "jdbc.username=" + username,
              content
          )

          content, pass_count = re.subn(
              r"(?m)^jdbc.password=.*$",
              lambda m: "jdbc.password=" + password,
              content
          )

          content, endpoint_count = re.subn(
              r"(?m)^(jdbc.url=jdbc:mysql://)db01(:.*)$",
              lambda m: m.group(1) + endpoint + m.group(2),
              content
          )

          if not all([user_count, pass_count, endpoint_count]):
              raise ValueError("Could not find all JDBC properties!")

          with open(file_path, "w") as file:
              file.write(content)

          print("RDS configuration updated successfully!")
          PY

      # 4. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build and push Docker image to ECR
      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry: ${{ secrets.REGISTRY }}
          repo: actapp
          region: ${{ env.AWS_REGION }}
          tags: latest,${{ github.run_number }}
          daemon_off: false
          dockerfile: ./Dockerfile
          context: ./

  
  