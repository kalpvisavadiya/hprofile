
name: Hprofile Actions
env:
  AWS_REGION: us-east-2
on:
  workflow_dispatch:

jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Code checkout
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java Version
      - name: Check Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Maven Build and Test
      - name: Maven Build and Test
        run: mvn clean verify

      # 5. Checkstyle
      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # 6. SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/
            -Dsonar.junit.reportPaths=target/surefire-reports/
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.java.binaries=target/classes

  BUILD_AND_PUBLISH:
    needs: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

     
      
      - name: Update application.properties file
        env:
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASS: ${{ secrets.RDS_PASS }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import os
          import re

          file_path = "src/main/resources/application.properties"

          with open(file_path, "r") as f:
              content = f.read()

          content = re.sub(
              r"(?m)^jdbc.username=.*$",
              lambda m: "jdbc.username=" + os.environ["RDS_USER"],
              content
          )

          content = re.sub(
              r"(?m)^jdbc.password=.*$",
              lambda m: "jdbc.password=" + os.environ["RDS_PASS"],
              content
          )

          content = re.sub(
              r"(?m)^(jdbc.url=jdbc:mysql://)db01(:.*)$",
              lambda m: m.group(1) + os.environ["RDS_ENDPOINT"] + m.group(2),
              content
          )

          with open(file_path, "w") as f:
              f.write(content)

          print("RDS configuration updated successfully!")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker Image
      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: actapp
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:latest .
          docker tag $REGISTRY/$REPOSITORY:latest $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 6. Push Docker Image to ECR
      - name: Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: actapp
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker push $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 7. Verify ECR Images
      - name: Verify ECR Images
        run: |
          aws ecr describe-images \
            --repository-name actapp \
            --region $AWS_REGION \
            --query 'imageDetails[*].imageTags' \
            --output table

