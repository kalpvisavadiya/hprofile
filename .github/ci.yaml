name: VProfile CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-sonar-docker:
    name: Build -> Test -> SonarCloud -> Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3. Build Application
        run: mvn -B clean package -DskipTests

      - name: 4. Run Unit Tests
        run: mvn -B test

      - name: 5. SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_KEY: ${{ vars.PROJECT_KEY }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar             -Dsonar.host.url="${SONAR_HOST_URL}"             -Dsonar.token="${SONAR_TOKEN}"             -Dsonar.organization="${ORGANIZATION}"             -Dsonar.projectKey="${PROJECT_KEY}"             -Dsonar.projectName="${PROJECT_NAME}"             -Dsonar.sources=src/main/java             -Dsonar.tests=src/test/java             -Dsonar.java.binaries=target/classes             -Dsonar.junit.reportPaths=target/surefire-reports             -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: 6. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7. Build Docker Image
        run: docker build -t vprofile:${{ github.sha }} .
